<!DOCTYPE html>
<html>
<head>
	<h1 style="color: #1431E3; text-decoration: underline; margin-bottom: 0px;">eCommerce</h1>
	<h2 style="color: #1431E3; margin-top: 0px;">Customer Churn Prediction</h2>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #CFEAFC;
			border: 6px solid black;
        }

        h1,h2,h3 {
            text-align: center;
			
        }

        form {
            background: #1431E3;
            padding: 20px;
            border-radius: 10px;
            max-width: 1200px;
            margin: auto;
			
        }

        .container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 5px;
			color: white;
			font-size: 18px;
        }

        input {
            padding: 8px;
			background: #E1E2E5;
			color: black;
			font-size: 14px;
			font-weight: bold;
        }

        .btn {
            margin-top: 25px;
            text-align: center;
			
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
            background-color: #96221B;
            color: #E4FA6E;
            border: none;
            border-radius: 5px;
			font-weight: bold;
        }

        button:hover {
            background-color: #005fa3;
        }

        .result {
            text-align: center;
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>
<body>
<h3 style="text-align: left; color: #1431E3; font-size: 22px; padding: 2px 26px; margin-bottom: 6px;">Enter Customer Details</h3>

<form action="/predict" method="POST">

    <div class="container">

        <div class="field">
            <label>Age</label>
            <input type="number" step="1" name="Age" min="5" max="75" placeholder="Between 5-75" required>
        </div>

        <div class="field">
            <label>Login Frequency</label>
            <input type="number" name="Login_Frequency" step="1" min="0" max="46" placeholder="Between 0-46" required>
        </div>

        <div class="field">
            <label>Session Duration Avg</label>
            <input type="number" step="any" name="Session_Duration_Avg" min="1" max="76" placeholder="Between 1-76" required>
        </div>

        <div class="field">
            <label>Pages Per Session</label>
            <input type="number" step="any" name="Pages_Per_Session" min="1" max="25" placeholder="Between 1-25" required>
        </div>

        <div class="field">
            <label>Cart Abandonment Rate</label>
            <input type="number" step="any" name="Cart_Abandonment_Rate" min="0" max="145" placeholder="Between 0-145" required>
        </div>

        <div class="field">
            <label>Wishlist Items</label>
            <input type="number" name="Wishlist_Items" min="0" max="30" placeholder="Between 0-30" required>
        </div>

        <div class="field">
            <label>Total Purchases</label>
            <input type="number" name="Total_Purchases" step="any" min="0" max="130" placeholder="Between 0-130" required>
        </div>

        <div class="field">
            <label>Average Order Value</label>
            <input type="number" step="any" name="Average_Order_Value" min="25" max="10000" placeholder="Between 25-10000" required>
        </div>

        <div class="field">
            <label>Days Since Last Purchase</label>
            <input type="number" step="1" name="Days_Since_Last_Purchase" min="0" max="365" placeholder="Between 0-365" required>
        </div>

        <div class="field">
            <label>Discount Usage Rate</label>
            <input type="number" step="0.01" name="Discount_Usage_Rate" min="0" max="120" placeholder="Between 0-120" required>
        </div>

        <div class="field">
            <label>Returns Rate</label>
            <input type="number" step="0.01" min="0" max="100" name="Returns_Rate" placeholder="Between 0-100" required>
        </div>

        <div class="field">
            <label>Email Open Rate</label>
            <input type="number" step="0.01" min="0" max="92" name="Email_Open_Rate" placeholder="Between 0-92" required>
        </div>

        <div class="field">
            <label>Customer Service Calls</label>
            <input type="number" name="Customer_Service_Calls" step="1" min="0" max="21" placeholder="Between 0-21" required>
        </div>

        <div class="field">
            <label>Product Reviews Written</label>
            <input type="number" name="Product_Reviews_Written" step="1" min="0" max="21" placeholder="Between 0-21" required>
        </div>

        <div class="field">
            <label>Social Media Engagement Score</label>
            <input type="number" step="0.01" min="0" max="100" name="Social_Media_Engagement_Score" placeholder="Between 0-100" required>
        </div>

        <div class="field">
            <label>Mobile App Usage</label>
            <input type="number" step="0.01" min="0" max="62" name="Mobile_App_Usage" placeholder="Between 0-62" required>
        </div>

        <div class="field">
            <label>Lifetime Value</label>
            <input type="number" step="0.01" name="Lifetime_Value" min="0" max="9000" placeholder="Between 0-9000" required>
        </div>

    </div>

    <div class="btn">
        <button type="submit" style="background-color: #0EEDED; color: black;">Predict Churn</button>
		<button type="reset" style="background-color: #E81A37; color: white; margin-left: 10px;">Reset Form</button>
    </div>

</form>
{% if prediction_text %}
<h2 style="color: #112C9C;">{{ prediction_text }}</h2>
<h3 style="color: #112C9C;">Churn Probability: {{ probability }}%</h3>
{% else %}
<h3 style="color: #112C9C;">Enter customer details and click <b style="font-size: 28px; background-color: #0EEDED;">Predict Churn</b></h3>
{% endif %}
</body>
</html>
